services:
  db:
    image: postgres:18
    expose:
      - 5432
    env_file: .env
    volumes:
      # Mount the local folder with your SQL files
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      # Persist the actual database data
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    volumes:
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 75s
    depends_on:
      - db
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    expose:
      - 3000
    env_file: .env
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - API_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
      - "3000:3000"
    volumes:
      - $PWD/conf:/etc/caddy
      - $PWD/src/frontend:/srv
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
